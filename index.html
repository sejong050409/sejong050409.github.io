<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박세종 Sejong Park · Korea University</title>
<meta name="description" content="박세종 — 고려대학교 사이버국방학과 / Dept. of Cyber Defense, Korea University">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 블랙 톤 고정 테마 */
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --surface: #111111;
    --bar: #181818;
    --text: #ededed;
    --muted: #8b8b8b;
    --line: #232323;
    --accent: #e5484d;           /* 크림슨 레드 포인트 */
    --accent-soft: #2a1213;
    --ok: #3fb950;
  }
  ::selection { background: var(--accent); color: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    /* 영문·숫자는 JetBrains Mono, 한글은 Pretendard로 대체 */
    font-family: "JetBrains Mono", "Pretendard", ui-monospace, Consolas, monospace;
    font-size: 15px;
    line-height: 1.65;
    word-break: keep-all;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 터미널 창 */
  .term {
    width: 100%; max-width: 880px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column;
  }
  .titlebar {
    display: flex; align-items: center; gap: 12px;
    height: 40px; padding: 0 14px;
    background: var(--bar); border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #3a3a3a; display: block; }
  .dots i:first-child { background: var(--accent); }
  .titlebar .title { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lang-btn {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 6px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--accent); color: var(--accent); }

  .screen {
    height: min(72vh, 680px);
    overflow-y: auto;
    padding: 16px 18px 20px;
    cursor: text;
    scrollbar-color: #333 transparent;
  }
  .out > .block { margin-bottom: 14px; }
  .echo { color: var(--text); }
  .ps1 { color: var(--accent); }
  .muted { color: var(--muted); }
  .err { color: var(--accent); }
  .ok { color: var(--ok); }

  .line { display: flex; align-items: center; gap: 8px; }
  .line input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: none;
    color: var(--text); font: inherit; caret-color: var(--accent);
    padding: 0;
  }

  /* 출력 내용 스타일 */
  .name { font-size: 22px; font-weight: 700; }
  .sec { color: var(--accent); font-weight: 700; margin-bottom: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tags span { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 8px; font-size: 13px; }
  .rows { display: grid; grid-template-columns: 150px 1fr; gap: 2px 16px; }
  .rows .k { color: var(--muted); }
  .item { padding: 6px 0 6px 12px; border-left: 2px solid var(--line); margin: 6px 0; }
  .item b { color: var(--text); }
  .item .meta { color: var(--muted); font-size: 13px; }
  .help-row { display: grid; grid-template-columns: 130px 1fr; gap: 0 16px; }
  .cmd-link {
    background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer;
    text-align: left;
  }
  .cmd-link:hover { text-decoration: underline; }

  /* 터미널 아래 빠른 실행 버튼 (타이핑이 불편한 방문자용) */
  .chips {
    width: 100%; max-width: 880px;
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;
  }
  .chips button {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chips button:hover { color: var(--accent); border-color: var(--accent); }
  .hint { width: 100%; max-width: 880px; margin-top: 10px; font-size: 12px; color: var(--muted); }

  .cursor {
    display: inline-block; width: 8px; height: 1.05em; margin-left: 2px;
    background: var(--text); vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

  @media (max-width: 600px) {
    body { padding: 16px; font-size: 14px; }
    .screen { height: 68vh; padding: 12px; }
    .titlebar .title { font-size: 12px; }
    .rows, .help-row { grid-template-columns: 1fr; }
    .rows .k { margin-top: 6px; }
    .help-row { margin-bottom: 4px; }
  }
</style>
</head>
<body>

<div class="term" role="application" aria-label="Terminal">
  <div class="titlebar">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title">sejong@cydf: ~</div>
    <button class="lang-btn" id="langBtn" type="button">EN</button>
  </div>
  <div class="screen" id="screen">
    <div class="out" id="out" aria-live="polite"></div>
    <form class="line" id="form" autocomplete="off">
      <label class="ps1" for="cmd">sejong@cydf:~$</label>
      <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go">
    </form>
  </div>
</div>

<div class="chips" id="chips"></div>
<p class="hint" id="hint"></p>

<noscript>
  <p style="max-width:880px">박세종 — 고려대학교 사이버국방학과 학부생 · GPA 4.11/4.5 · D4D 국방 기술 해커톤 T2 Winner (Cluevia) ·
  <a href="https://github.com/sejong050409">GitHub</a></p>
</noscript>

<script>
(function () {
  /* ============================================================
     내용 수정은 여기(DATA)에서 하세요. ko = 국문, en = 영문
     ============================================================ */
  var USER = 'sejong050409';   /* GitHub 아이디 (링크용) */
  var NAME = 'sejong';         /* 프롬프트에 표시되는 사용자 이름 */
  var DATA = {
    whoami: {
      ko: '<div class="name">박세종</div><div class="muted">고려대학교 사이버국방학과 학부생</div>',
      en: '<div class="name">Sejong Park</div><div class="muted">Undergraduate Student, Department of Cyber Defense, Korea University</div>'
    },
    info: {
      ko: '<div class="sec">## 소개</div>' +
          '<p>고려대학교 사이버국방학과 3학년에 재학 중입니다. 금융보안과 데이터베이스에 관심이 있으며, ' +
          '특히 이상거래 탐지 결과가 왜 나왔는지, 그리고 왜 놓쳤는지를 데이터 근거로 설명하는 방법을 연구하고 싶습니다. ' +
          'D4D 국방 기술 해커톤에서는 why-not provenance 연구를 바탕으로 정보 공백 계산 엔진을 구현했습니다.</p>' +
          '<div class="tags"><span>금융보안</span><span>데이터베이스</span><span>Data Provenance</span></div>',
      en: '<div class="sec">## About</div>' +
          '<p>I am a third-year undergraduate in the Department of Cyber Defense at Korea University. ' +
          'I am interested in financial security and databases, particularly in explaining, with data-level evidence, ' +
          'why a fraud detection system flags or misses a transaction. ' +
          'At the D4D defense-tech hackathon, I implemented an information-gap engine based on why-not provenance research.</p>' +
          '<div class="tags"><span>Financial Security</span><span>Databases</span><span>Data Provenance</span></div>'
    },
    news: {
      ko: '<div class="sec">## 소식</div>' +
          '<div class="rows"><span class="k">2026.10</span><span><b>D4D 국방 기술 해커톤</b> T2 (OSINT) 트랙에서 <b>Cluevia</b>로 Winner를 수상했습니다.</span></div>',
      en: '<div class="sec">## News</div>' +
          '<div class="rows"><span class="k">2026.10</span><span>Won the T2 (OSINT) track of the <b>D4D Defense-Tech Hackathon</b> with <b>Cluevia</b>.</span></div>'
    },
    edu: {
      ko: '<div class="sec">## 학력</div>' +
          '<div class="item"><b>고려대학교</b> 사이버국방학과 학사 과정<br>' +
          '<span class="meta">3학년 재학 중 · 평점 4.11 / 4.5</span></div>',
      en: '<div class="sec">## Education</div>' +
          '<div class="item"><b>Korea University</b> — B.S. in Cyber Defense<br>' +
          '<span class="meta">Third-year, in progress · GPA 4.11 / 4.5</span></div>'
    },
    projects: {
      ko: '<div class="sec">## 프로젝트</div>' +
          '<div class="item"><b>Cluevia</b> — AI 기반 OSINT 분석 시스템<br>' +
          '<span class="meta">D4D 국방 기술 해커톤 T2 Winner · 2026.10 · 4인 팀 · 백엔드 담당</span><br>' +
          '분석가가 내리려는 결론에 대해, 결론에 도달하기 위해 부족한 정보 공백을 찾아내고 ' +
          '각 공백을 채웠을 때 결론에 도달할 확률이 얼마나 오르는지 계산합니다. ' +
          'why-not provenance 논문(<a href="https://arxiv.org/abs/1808.05752" target="_blank" rel="noopener">Lee et al., PUG</a>)의 AND/OR 구조를 바탕으로 공백 계산 엔진을 구현했고, ' +
          '특히 조건 간 독립성을 확인할 수 없을 때 점수를 단정하지 않고 Fréchet/Bonferroni 하한·상한으로 신뢰도 범위를 계산해 ' +
          '충족·미충족·판정 보류를 구분하는 기능을 맡았습니다.<br>' +
          '<span class="meta">TypeScript · Node.js · React · SQLite · Claude API</span> · <a href="https://github.com/d4d-cydf/Cluevia" target="_blank" rel="noopener">GitHub</a></div>',
      en: '<div class="sec">## Projects</div>' +
          '<div class="item"><b>Cluevia</b> — AI-Powered OSINT Analysis System<br>' +
          '<span class="meta">Winner, D4D Hackathon T2 · 2026.10 · Team of 4 · Backend</span><br>' +
          'Given the conclusion an analyst wants to reach, Cluevia identifies the information gaps that block it ' +
          'and estimates how much filling each gap raises the probability of reaching that conclusion. ' +
          'I built the gap-computation engine on the AND/OR structure from why-not provenance research ' +
          '(<a href="https://arxiv.org/abs/1808.05752" target="_blank" rel="noopener">Lee et al., PUG</a>). ' +
          'In particular, when independence between conditions cannot be established, my component computes ' +
          'Fréchet/Bonferroni lower and upper bounds instead of a single score, classifying each claim as sufficient, insufficient, or undetermined.<br>' +
          '<span class="meta">TypeScript · Node.js · React · SQLite · Claude API</span> · <a href="https://github.com/d4d-cydf/Cluevia" target="_blank" rel="noopener">GitHub</a></div>'
    },
    award: {
      ko: '<div class="sec">## 수상 경력</div>' +
          '<div class="rows"><span class="k">2026.10.11</span><span><b>Winner</b> · D4D (Deploy for Defense) 국방 기술 해커톤, ' +
          'T2. OSINT &amp; Open-Source Intelligence for APAC 트랙 · 프로젝트 Cluevia</span></div>',
      en: '<div class="sec">## Honors &amp; Awards</div>' +
          '<div class="rows"><span class="k">2026.10.11</span><span><b>Winner</b> · D4D (Deploy for Defense) Hackathon, ' +
          'Track T2: OSINT &amp; Open-Source Intelligence for APAC · Project Cluevia</span></div>'
    },
    skills: {
      ko: '<div class="sec">## 기술 역량</div><div class="rows">' +
          '<span class="k">프로그래밍 언어</span><span>[Python, C/C++, …]</span>' +
          '<span class="k">보안 도구</span><span>[IDA, Ghidra, Wireshark, Burp Suite, …]</span>' +
          '<span class="k">개발 환경</span><span>[Linux, Docker, Git]</span>' +
          '<span class="k">어학</span><span>[TOEIC 000 / TEPS 000]</span></div>',
      en: '<div class="sec">## Skills</div><div class="rows">' +
          '<span class="k">Languages</span><span>[Python, C/C++, …]</span>' +
          '<span class="k">Security Tools</span><span>[IDA, Ghidra, Wireshark, Burp Suite, …]</span>' +
          '<span class="k">Environment</span><span>[Linux, Docker, Git]</span>' +
          '<span class="k">Language Tests</span><span>[TOEIC 000 / TEPS 000]</span></div>'
    },
    contact: {
      ko: '<div class="sec">## 연락처</div><div class="rows">' +
          '<span class="k">Email</span><span><a href="mailto:sejong050409@korea.ac.kr">sejong050409@korea.ac.kr</a></span>' +
          '<span class="k">GitHub</span><span><a href="https://github.com/' + USER + '" target="_blank" rel="noopener">github.com/' + USER + '</a></span></div>',
      en: null /* 아래에서 ko와 동일하게 채움 */
    }
  };
  DATA.contact.en = DATA.contact.ko.replace('## 연락처', '## Contact');

  /* 명령어 목록: 이름, 설명(ko/en), 실행 함수 */
  var COMMANDS = [
    { name: '/help',     desc: { ko: '명령어 목록 보기', en: 'List commands' } },
    { name: '/whoami',   desc: { ko: '간단한 소개', en: 'Who am I' } },
    { name: '/info',     desc: { ko: '자기소개와 관심 분야', en: 'About me & interests' } },
    { name: '/news',     desc: { ko: '최근 소식', en: 'Recent news' } },
    { name: '/edu',      desc: { ko: '학력', en: 'Education' } },
    { name: '/projects', desc: { ko: '프로젝트', en: 'Projects' } },
    { name: '/award',    desc: { ko: '수상 경력', en: 'Honors & awards' } },
    { name: '/contact',  desc: { ko: '연락처와 GitHub', en: 'Contact & GitHub' } },
    { name: '/all',      desc: { ko: '전체 내용 한 번에 보기', en: 'Show everything' } },
    { name: '/lang',     desc: { ko: '언어 전환 (ko / en)', en: 'Switch language (ko / en)' } },
    { name: '/clear',    desc: { ko: '화면 지우기', en: 'Clear screen' } }
  ];
  var ALIASES = { '/awards': '/award', '/about': '/info', '/education': '/edu', '/project': '/projects', '/skill': '/skills', '/ls': '/help', '/cls': '/clear' };

  var TEXT = {
    welcome: { ko: '방문해 주셔서 감사합니다. <button class="cmd-link" data-cmd="/help">/help</button> 를 입력하거나 아래 버튼을 눌러 보세요.',
               en: 'Welcome. Type <button class="cmd-link" data-cmd="/help">/help</button> or click a button below.' },
    notFound: { ko: '명령어를 찾을 수 없습니다: ', en: 'command not found: ' },
    tryHelp:  { ko: ' — /help 를 입력해 보세요.', en: ' — try /help.' },
    langSet:  { ko: '언어를 한국어로 바꿨습니다.', en: 'Language set to English.' },
    opening:  { ko: 'cv.pdf 를 여는 중…', en: 'Opening cv.pdf…' },
    hint:     { ko: 'Tab: 자동완성 · ↑/↓: 이전 명령어 · 슬래시(/)는 생략해도 됩니다',
                en: 'Tab: autocomplete · ↑/↓: history · the leading slash is optional' }
  };

  /* ============================================================ */
  var out = document.getElementById('out');
  var screen = document.getElementById('screen');
  var input = document.getElementById('cmd');
  var form = document.getElementById('form');
  var chips = document.getElementById('chips');
  var langBtn = document.getElementById('langBtn');
  var hint = document.getElementById('hint');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var lang = 'ko';
  try { var s = localStorage.getItem('lang'); if (s === 'ko' || s === 'en') lang = s; } catch (e) {}

  var history = [], hIdx = 0;

  function t(obj) { return obj[lang]; }
  function scrollDown() { screen.scrollTop = screen.scrollHeight; }
  function print(html, cls) {
    var div = document.createElement('div');
    div.className = 'block' + (cls ? ' ' + cls : '');
    div.innerHTML = html;
    out.appendChild(div);
    scrollDown();
  }
  function echo(cmd) {
    var div = document.createElement('div');
    div.className = 'echo';
    div.innerHTML = '<span class="ps1">' + NAME + '@cydf:~$</span> ';
    div.appendChild(document.createTextNode(cmd));
    out.appendChild(div);
  }
  function helpHtml() {
    var h = '<div class="sec">## ' + (lang === 'ko' ? '명령어' : 'Commands') + '</div>';
    COMMANDS.forEach(function (c) {
      h += '<div class="help-row"><button class="cmd-link" data-cmd="' + c.name + '">' + c.name + '</button><span class="muted">' + t(c.desc) + '</span></div>';
    });
    return h;
  }
  function renderChips() {
    chips.innerHTML = '';
    ['/info', '/news', '/edu', '/projects', '/award', '/contact', '/all'].forEach(function (name) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = name; b.dataset.cmd = name;
      chips.appendChild(b);
    });
    langBtn.textContent = lang === 'ko' ? 'EN' : '한국어';
    hint.textContent = t(TEXT.hint);
    document.documentElement.lang = lang;
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem('lang', l); } catch (e) {}
    renderChips();
  }

  function run(raw) {
    var line = raw.trim();
    echo(line);
    if (!line) { scrollDown(); return; }
    history.push(line); hIdx = history.length;

    var parts = line.split(/\s+/);
    var cmd = parts[0].toLowerCase();
    if (cmd.charAt(0) !== '/') cmd = '/' + cmd;
    cmd = ALIASES[cmd] || cmd;
    var arg = (parts[1] || '').toLowerCase();

    switch (cmd) {
      case '/help': print(helpHtml()); break;
      case '/whoami': print(t(DATA.whoami)); break;
      case '/info': print(t(DATA.info)); break;
      case '/news': print(t(DATA.news)); break;
      case '/edu': print(t(DATA.edu)); break;
      case '/projects': print(t(DATA.projects)); break;
      case '/award': print(t(DATA.award)); break;
      case '/contact': print(t(DATA.contact)); break;
      case '/all':
        ['whoami', 'info', 'news', 'edu', 'projects', 'award', 'contact'].forEach(function (k) { print(t(DATA[k])); });
        break;
      case '/lang':
        setLang(arg === 'ko' || arg === 'en' ? arg : (lang === 'ko' ? 'en' : 'ko'));
        print(t(TEXT.langSet), 'ok');
        break;
      case '/clear': out.innerHTML = ''; break;
      case '/sudo': print('Permission denied: nice try ;)', 'err'); break;
      default:
        var span = document.createElement('div');
        span.className = 'block err';
        span.appendChild(document.createTextNode(t(TEXT.notFound) + parts[0]));
        span.appendChild(document.createTextNode(t(TEXT.tryHelp)));
        out.appendChild(span); scrollDown();
    }
  }

  /* 버튼 클릭: 명령어를 입력창에 쳐서 실행한 것처럼 */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-cmd]');
    if (el) { e.preventDefault(); run(el.dataset.cmd); input.focus({ preventScroll: true }); return; }
    if (e.target.closest('#screen') && !window.getSelection().toString() && !e.target.closest('a')) input.focus();
  });
  langBtn.addEventListener('click', function () { run('/lang'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value; input.value = '';
    run(v);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') {
      if (hIdx > 0) { hIdx--; input.value = history[hIdx]; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (hIdx < history.length - 1) { hIdx++; input.value = history[hIdx]; }
      else { hIdx = history.length; input.value = ''; }
      e.preventDefault();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      var v = input.value.trim().toLowerCase();
      if (!v) return;
      if (v.charAt(0) !== '/') v = '/' + v;
      var hits = COMMANDS.filter(function (c) { return c.name.indexOf(v) === 0; });
      if (hits.length === 1) input.value = hits[0].name + ' ';
      else if (hits.length > 1) { echo(input.value); print(hits.map(function (c) { return c.name; }).join('   '), 'muted'); }
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault(); out.innerHTML = '';
    }
  });

  /* 첫 화면: whoami를 타이핑하는 연출 → 소개 → 안내 */
  function boot() {
    renderChips();
    var word = '/whoami';
    if (reduceMotion) { run(word); print(t(TEXT.welcome), 'muted'); input.focus({ preventScroll: true }); return; }
    var i = 0;
    var typing = document.createElement('div');
    typing.className = 'echo';
    typing.innerHTML = '<span class="ps1">' + NAME + '@cydf:~$</span> <span id="typed"></span><span class="cursor"></span>';
    out.appendChild(typing);
    var typed = typing.querySelector('#typed');
    var timer = setInterval(function () {
      typed.textContent += word.charAt(i++);
      if (i >= word.length) {
        clearInterval(timer);
        setTimeout(function () {
          out.removeChild(typing);
          run(word);
          print(t(TEXT.welcome), 'muted');
          input.focus({ preventScroll: true });
        }, 250);
      }
    }, 90);
  }
  boot();
})();
</script>
